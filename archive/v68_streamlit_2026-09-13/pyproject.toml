[project]
name = "fitorder"
version = "2026.09.11-68"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.40",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "Pillow>=10.0",
  "openai>=1.40",
  "python-dotenv>=1.0",
  "PyMuPDF>=1.24",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
